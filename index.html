<!DOCTYPE html>
<html lang="en-US">

<head>

  <title>CSS Tut</title>

  <meta name="author" content="Joseph Vasquez">
  <meta name="description" content="Learning HTML and CSS">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    body {
      font-family: Arial, Helvetica, serif;
      background-color: teal;
      color: black;
      margin: 0;
    }

    .wrap {
      width: 80%;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: orange;
    }

    h2 {
      text-align: center;
      color: #333333;
    }

    p {
      line-height: 1.5;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav a {
      width: 200px;
      margin: 10px;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      color: #b94bac;
      background-color: white;
      border: 2px solid #b94bac;
      border-radius: 5px;
    }

    nav a:hover {
      background-color: #b94bac;
      color: white;
    }

    .minimalist {
      background-color: white;
      padding: 30px;
      margin: 30px 0;
      border-radius: 10px;
      text-align: center;
    }

    .minimalist p {
      color: #555555;
    }

    .box {
      width: 150px;
      padding: 30px;
      margin: 30px auto;
      text-align: center;
      background-color: lightblue;
      border: 5px solid green;
      box-shadow: 5px 5px 10px;
    }


    .animation-box {
      width: 100px;
      height: 100px;
      margin: 30px auto;
      background-color: orange;

      animation-name: changeColor;
      animation-duration: 3s;
      animation-iteration-count: infinite;
    }

    @keyframes changeColor {

      0% {
        background-color: orange;
      }

      50% {
        background-color: purple;
        transform: scale(1.3);
      }

      100% {
        background-color: orange;
      }
    }

    .position-area {
      position: relative;
      height: 350px;
      background-color: teal;
      margin: 30px 0;
    }

    .relative-box {
      width: 80px;
      height: 80px;
      background-color: yellow;
      position: relative;
      top: 20px;
      left: 20px;
    }

    .absolute-box {
      width: 80px;
      height: 80px;
      background-color: red;
      position: absolute;
      top: 100px;
      left: 150px;
    }

    .fixed-box {
      width: 80px;
      height: 80px;
      background-color: brown;
      position: absolute;
      top: 200px;
      right: 30px;
    }

    .art {
      position: relative;
      width: 500px;
      height: 350px;
      max-width: 100%;
      margin: 30px auto;
      background-color: #24113d;
      border: 5px solid black;
      overflow: hidden;
    }

    .planet {
      position: absolute;
      width: 130px;
      height: 130px;
      left: 180px;
      top: 130px;
      background-color: orange;
      border-radius: 50%;
      box-shadow: 5px 8px 15px black;
      animation: movePlanet 3s infinite;
    }

    @keyframes movePlanet {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
      100% {
        transform: translateY(0px);
      }
    }

  </style>

</head>

<body>

  <div class="wrap">

    <h1>Hello!</h1>

    <p>
     welcomeeeeeee to my codingggggg this is really funnnnnnn -________-
    </p>

    <nav>

      <a href="https://en.wikipedia.org/wiki/Apple">
        Don't
      </a>
      <a href="https://en.wikipedia.org/wiki/Orange_(fruit)">
        Click
      </a>
      <a href="https://en.wikipedia.org/wiki/University_of_Illinois_Chicago">
      On
      </a>
      <a href="https://en.wikipedia.org/wiki/Vera_Moln%C3%A1r">
        These
      </a>
    </nav>

    <div class="minimalist">
      <p>
       im new i just followed the templates and hoped for the best
      </p>

    </div>

    <div class="box">
      Hello Ms. B .^.
    </div>

    <p>
      expand and change colors +_+
    </p>

    <div class="animation-box"></div>


    <p>
      spaced out sqaures 0_0
    </p>

    <div class="position-area">

      <div class="relative-box"></div>

      <div class="absolute-box"></div>

      <div class="fixed-box"></div>

    </div>

    <div class="art">

      <div class="planet"></div>

    </div>

  </div>

</body>

</html>
